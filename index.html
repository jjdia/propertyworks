<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropertyWorks">
<link rel="manifest" href="./manifest.webmanifest">
<title>PropertyWorks</title>
<style>
:root{--bg:#f5f7fa;--surface:#ffffff;--surface2:#f4f6f8;--ink:#1b1f23;--muted:#5f6b7a;--line:#d9dee5;--navy:#0b2d4d;--blue:#117aca;--blue2:#0a5f9e;--green:#2e7d5b;--amber:#b7791f;--red:#c53d3d;--shadow:0 10px 28px rgba(11,45,77,.08);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:linear-gradient(180deg,#0b2d4d,#08233d);color:#fff;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#1687d9,#0a5f9e);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 20px rgba(17,122,202,.25)}.brand h1{font-size:16px;margin:0}.brand small{display:block;color:#c4cfda;margin-top:2px;font-size:11px}
.nav{display:grid;gap:5px}.navbtn{border:0;background:transparent;color:#d0d9e2;border-radius:12px;padding:12px 13px;text-align:left;display:flex;align-items:center;gap:11px;font-size:13px}.navbtn:hover,.navbtn.active{background:rgba(255,255,255,.08);color:#fff}.navbtn.active{box-shadow:inset 3px 0 #37a4e8}.sidefoot{margin-top:auto}.portfolio-mini{padding:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:14px}.portfolio-mini b{font-size:12px}.portfolio-mini p{font-size:10px;color:#93a4bd;margin:4px 0 0}
.main{min-width:0}.topbar{height:84px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.topbar h2{margin:0;font-size:22px;letter-spacing:-.03em}.topbar p{margin:5px 0 0;font-size:12px;color:var(--muted)}.actions{display:flex;gap:10px;align-items:center}.role-select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:var(--ink);font-weight:700;font-size:11px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 7px 18px rgba(17,122,202,.20)}.btn-primary:hover{background:var(--blue2)}.btn-soft{background:#eaf2f8;color:#0b2d4d}
.content{padding:26px 30px 90px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:18px}.kpihead{display:flex;justify-content:space-between;align-items:center}.kpilabel{font-size:11px;color:var(--muted);font-weight:700}.kpiicon{width:32px;height:32px;border-radius:10px;background:#e8f3fb;color:var(--blue);display:grid;place-items:center}.kpivalue{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:13px}.kpifoot{font-size:10px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.panel{padding:18px}.panelhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.panelhead h3{font-size:15px;margin:0}.panelhead p{font-size:10px;color:var(--muted);margin:4px 0 0}.chip{font-size:9px;font-weight:800;border-radius:999px;padding:5px 8px;background:#edf2f7;color:#4a5568}.chip.good{background:#e9f5ef;color:var(--green)}.chip.warn{background:#fff5e6;color:var(--amber)}.chip.bad{background:#fdecec;color:var(--red)}
.chart{height:220px;display:flex;align-items:flex-end;gap:12px;padding:15px 8px 26px;border-bottom:1px solid var(--line)}.monthgroup{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative}.bar{width:15px;border-radius:6px 6px 0 0}.bar.income{background:linear-gradient(180deg,#3f9ddd,#117aca)}.bar.expense{background:#c8d8e6}.mlabel{position:absolute;bottom:-20px;font-size:9px;color:var(--muted)}.legend{display:flex;gap:14px;font-size:9px;color:var(--muted);margin-top:10px}.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}.l1{background:#117aca}.l2{background:#c8d8e6}
.attn{display:grid;gap:9px}.attnitem{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.attnicon{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:#475569}.attntext b{font-size:11px;display:block}.attntext span{font-size:9px;color:var(--muted)}.attnright{margin-left:auto;font-size:9px;color:var(--muted)}
.propertygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}.property{overflow:hidden}.propcover{height:92px;background:linear-gradient(135deg,#eef6fb,#f9fcfe);padding:14px;display:flex;justify-content:space-between}.propbadge{width:36px;height:36px;background:#fff;border:1px solid #d7e4ee;border-radius:12px;display:grid;place-items:center;color:var(--blue);font-weight:800}.propbody{padding:16px}.propname{font-size:14px;font-weight:800}.propaddr{font-size:9px;color:var(--muted);margin-top:4px}.propstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:var(--surface2);padding:9px;border-radius:10px}.stat b{display:block;font-size:12px}.stat span{font-size:8px;color:var(--muted)}
.sectionbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-width:240px}.tablecard{padding:0;overflow:hidden}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:1px solid var(--line)}td{padding:13px 14px;border-bottom:1px solid var(--line)}.rowtitle{font-weight:750}.rowsub{font-size:9px;color:var(--muted);margin-top:2px}.status{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;padding:5px 8px;border-radius:999px}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.status.good{background:#e9f8f2;color:var(--green)}.status.warn{background:#fff4e7;color:var(--amber)}.status.bad{background:#fdecec;color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:11px}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.mini{padding:16px}.mini h3{margin:0;font-size:13px}.mini p{font-size:9px;color:var(--muted);margin:4px 0 0}.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.kv:last-child{border:0}
.mobilebar{display:none}
dialog{width:min(660px,92vw);border:0;border-radius:20px;padding:0;box-shadow:0 30px 80px rgba(2,6,23,.3)}dialog::backdrop{background:rgba(2,6,23,.5);backdrop-filter:blur(3px)}.modal{padding:22px}.modalhead{display:flex;justify-content:space-between}.modalhead small{font-size:9px;letter-spacing:.12em;color:var(--blue);font-weight:900}.modalhead h3{margin:5px 0 0;font-size:20px}.close{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:90px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.propertygrid,.mini-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.topbar{height:auto;padding:16px 18px;position:sticky}.topbar h2{font-size:19px}.topbar p{display:none}.actions .btn-soft{display:none}.role-select{max-width:118px;padding:8px 7px}.content{padding:16px 16px 100px}.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpivalue{font-size:22px}.grid2{gap:12px}.propertygrid,.mini-grid{grid-template-columns:1fr}.chart{height:180px}.search{min-width:0;width:100%}.sectionbar{align-items:stretch;flex-direction:column}.mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;backdrop-filter:blur(16px)}.mnav{border:0;background:transparent;color:#94a3b8;font-size:9px;display:grid;gap:3px;place-items:center}.mnav.active{color:var(--blue)}.mnav span{font-size:18px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}table{min-width:680px}.tablecard{overflow:auto}.topbar .btn-primary{padding:9px 11px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">PW</div><div><h1>PropertyWorks</h1><small>Real Estate Command Center</small></div></div><nav class="nav" id="desktopNav"></nav><div class="sidefoot"><div class="portfolio-mini"><b>Staten Island Portfolio</b><p>Manage · Buy · Sell · Renovate · Grow</p></div></div></aside>
<main class="main"><header class="topbar"><div><h2 id="pageTitle">Overview</h2><p id="pageSub">Your entire real estate operation in one place.</p></div><div class="actions"><select id="roleSelect" class="role-select" onchange="switchRole(this.value)"><option value="owner">Owner / Admin</option><option value="tenant">Tenant View</option></select><button id="exportBtn" class="btn btn-soft" onclick="exportData()">Export</button><button id="addNewBtn" class="btn btn-primary" onclick="quickAdd()">＋ Add New</button></div></header><section class="content" id="content"></section></main>
</div>
<nav class="mobilebar" id="mobileNav"></nav>
<dialog id="dlg"><form method="dialog" id="form" class="modal"><div class="modalhead"><div><small id="modalEyebrow">NEW</small><h3 id="modalTitle">Add</h3></div><button value="cancel" class="close">×</button></div><div id="modalBody"></div><div class="modalactions"><button value="cancel" class="btn btn-soft">Cancel</button><button value="default" class="btn btn-primary">Save</button></div></form></dialog>
<script>
const KEY="propertyworks_v3";
const seed={properties:[{id:"p1",name:"62 Fillmore",address:"62 Fillmore Street, Staten Island, NY 10301",type:"Two-Family",units:2,occupied:2,rent:7600},{id:"p2",name:"48 Jackson",address:"48 Jackson Street, Staten Island, NY",type:"Two-Family",units:2,occupied:2,rent:0},{id:"p3",name:"354 Hoyt",address:"354 Hoyt Avenue, Staten Island, NY",type:"Multi-Family",units:3,occupied:3,rent:0}],tenants:[],leases:[],payments:[],expenses:[],maintenance:[{id:"m1",propertyId:"p1",title:"Common-area safety check",unit:"Common",priority:"High",status:"Open",date:"2026-09-14"}],deals:[],renovations:[],documents:[{id:"d1",propertyId:"p3",name:"Fully Executed Contract of Sale",type:"Contract",date:"2026-09-14",notes:"354 Hoyt Avenue"}],chart:[{m:"Apr",i:14500,e:6600},{m:"May",i:15800,e:7000},{m:"Jun",i:16600,e:7400},{m:"Jul",i:17200,e:7200},{m:"Aug",i:18000,e:7600},{m:"Sep",i:18000,e:7900}]};
let data=load(),view="overview",currentRole=localStorage.getItem("propertyworks_role")||"owner";function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),prop=id=>data.properties.find(x=>x.id===id),tenant=id=>data.tenants.find(x=>x.id===id),df=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const ownerNav=[["overview","⌂","Overview"],["properties","▦","Properties"],["rentals","$","Rentals"],["service","🛠","Service Requests"],["cameras","◉","Cameras"],["deals","↕","Buy & Sell"],["renovations","◇","Renovations"],["financials","↗","Financials"],["documents","▣","Documents"]]; const tenantNav=[["tenantHome","⌂","Home"],["tenantService","🛠","Maintenance"]];
function navRender(){desktopNav.innerHTML=nav.map(n=>'<button class="navbtn '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join("");mobileNav.innerHTML=[nav[0],nav[1],nav[2],nav[3],nav[4]].map(n=>'<button class="mnav '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join("")}
function setHeader(t,s){pageTitle.textContent=t;pageSub.textContent=s}function metric(label,value,foot,icon){return '<div class="card kpi"><div class="kpihead"><div class="kpilabel">'+label+'</div><div class="kpiicon">'+icon+'</div></div><div class="kpivalue">'+value+'</div><div class="kpifoot">'+foot+'</div></div>'}
function overview(){setHeader("Overview","Your entire real estate operation in one place.");const income=data.payments.filter(x=>x.status==="Paid").reduce((a,b)=>a+(+b.amount||0),0)||18000,exp=data.expenses.reduce((a,b)=>a+(+b.amount||0),0),units=data.properties.reduce((a,b)=>a+(+b.units||0),0),occ=data.properties.reduce((a,b)=>a+(+b.occupied||0),0),open=data.maintenance.filter(x=>x.status!=="Completed").length;content.innerHTML='<div class="kpis">'+metric("Monthly Income",money(income),"Portfolio rental income","$")+metric("Occupancy",Math.round(occ/units*100)+"%",occ+" of "+units+" units occupied","⌂")+metric("Open Items",open,"Maintenance requiring attention","!")+metric("Net Cash Flow",money(income-exp),"Recorded income less expenses","↗")+'</div><div class="grid2"><div class="card panel"><div class="panelhead"><div><h3>Portfolio Cash Flow</h3><p>Income versus operating expenses</p></div><span class="chip good">6 months</span></div>'+chart()+'</div><div class="card panel"><div class="panelhead"><div><h3>Needs Attention</h3><p>Priority items across your portfolio</p></div><span class="chip">'+(open+2)+' items</span></div><div class="attn"><div class="attnitem"><div class="attnicon">▤</div><div class="attntext"><b>Review lease renewals</b><span>Check upcoming expirations</span></div><div class="attnright">This week</div></div>'+data.maintenance.filter(x=>x.status!=="Completed").slice(0,2).map(m=>'<div class="attnitem"><div class="attnicon">◇</div><div class="attntext"><b>'+esc(m.title)+'</b><span>'+esc(prop(m.propertyId)?.name||"")+' · '+esc(m.priority)+'</span></div><div class="attnright">'+esc(m.status)+'</div></div>').join("")+'<div class="attnitem"><div class="attnicon">$</div><div class="attntext"><b>Reconcile monthly rent</b><span>Tenant + subsidy portions</span></div><div class="attnright">Monthly</div></div></div></div></div><div class="propertygrid">'+data.properties.map(propertyCard).join("")+'</div>'}
function chart(){const max=Math.max(...data.chart.flatMap(x=>[x.i,x.e]));return '<div class="chart">'+data.chart.map(x=>'<div class="monthgroup"><div class="bar income" style="height:'+Math.round(x.i/max*100)+'%"></div><div class="bar expense" style="height:'+Math.round(x.e/max*100)+'%"></div><span class="mlabel">'+x.m+'</span></div>').join("")+'</div><div class="legend"><span><i class="l1"></i>Income</span><span><i class="l2"></i>Expenses</span></div>'}
function propertyCard(p){const o=Math.round((p.occupied/p.units)*100);return '<div class="card property"><div class="propcover"><div class="propbadge">'+esc(p.name.split(" ").pop()[0])+'</div><span class="chip good">'+o+'% occupied</span></div><div class="propbody"><div class="propname">'+esc(p.name)+'</div><div class="propaddr">'+esc(p.address)+'</div><div class="propstats"><div class="stat"><b>'+p.units+'</b><span>Units</span></div><div class="stat"><b>'+p.occupied+'</b><span>Occupied</span></div><div class="stat"><b>'+money(p.rent)+'</b><span>Rent/mo</span></div></div></div></div>'}
function properties(){setHeader("Properties","All owned assets, occupancy and operating details.");content.innerHTML='<div class="sectionbar"><input class="search" placeholder="Search properties"><button class="btn btn-primary" onclick="addProperty()">＋ Add Property</button></div><div class="propertygrid">'+data.properties.map(propertyCard).join("")+'</div>'}
function rentals(){setHeader("Rentals","Tenants, leases, rent payments and maintenance in one workflow.");content.innerHTML='<div class="kpis">'+metric("Tenants",data.tenants.length,"Active tenant records","👥")+metric("Active Leases",data.leases.filter(x=>x.status==="Active").length,"Current agreements","▤")+metric("Payments",data.payments.length,"Ledger transactions","$")+metric("Maintenance",data.maintenance.filter(x=>x.status!=="Completed").length,"Open work orders","◇")+'</div><div class="card panel" style="margin-top:16px"><div class="sectionbar"><div><b style="font-size:13px">Rent Ledger</b><div class="rowsub">Track tenant and agency payments</div></div><button class="btn btn-primary" onclick="addPayment()">＋ Record Payment</button></div>'+paymentTable()+'</div><div class="mini-grid" style="margin-top:16px"><div class="card mini"><div class="panelhead"><div><h3>Tenants</h3><p>Contacts and units</p></div><button class="btn btn-soft" onclick="addTenant()">Add</button></div>'+simpleList(data.tenants,x=>x.name,x=>prop(x.propertyId)?.name+" · "+(x.unit||""))+'</div><div class="card mini"><div class="panelhead"><div><h3>Leases</h3><p>Dates, rent and status</p></div><button class="btn btn-soft" onclick="addLease()">Add</button></div>'+simpleList(data.leases,x=>tenant(x.tenantId)?.name||"Lease",x=>money(x.rent)+" · "+x.status)+'</div><div class="card mini"><div class="panelhead"><div><h3>Maintenance</h3><p>Open work orders</p></div><button class="btn btn-soft" onclick="addMaintenance()">Add</button></div>'+simpleList(data.maintenance,x=>x.title,x=>(prop(x.propertyId)?.name||"")+" · "+x.status)+'</div></div>'}
function simpleList(arr,title,sub){return arr.length?arr.slice(0,4).map(x=>'<div class="kv"><div><b>'+esc(title(x))+'</b><div class="rowsub">'+esc(sub(x)||"")+'</div></div></div>').join(""):'<div class="empty">Nothing here yet.</div>'}function paymentTable(){return data.payments.length?'<div class="tablecard"><table><thead><tr><th>Date</th><th>Property</th><th>Tenant</th><th>Source</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+data.payments.map(x=>'<tr><td>'+df(x.date)+'</td><td>'+esc(prop(x.propertyId)?.name||"")+'</td><td class="rowtitle">'+esc(tenant(x.tenantId)?.name||"—")+'</td><td>'+esc(x.source||"Tenant")+'</td><td>'+money(x.amount)+'</td><td><span class="status '+(x.status==="Paid"?"good":x.status==="Late"?"bad":"warn")+'">'+esc(x.status)+'</span></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No rent transactions yet.</div>'}
function deals(){setHeader("Buy & Sell","Track acquisitions, listings, offers and closings.");content.innerHTML='<div class="sectionbar"><div></div><button class="btn btn-primary" onclick="addDeal()">＋ Add Deal</button></div><div class="mini-grid">'+(data.deals.length?data.deals.map(d=>'<div class="card mini"><div class="panelhead"><div><h3>'+esc(d.name)+'</h3><p>'+esc(d.type)+' · '+esc(d.stage)+'</p></div><span class="chip">'+money(d.price)+'</span></div><div class="kv"><span>Property</span><b>'+esc(d.address||"—")+'</b></div><div class="kv"><span>Target / Price</span><b>'+money(d.price)+'</b></div><div class="kv"><span>Stage</span><b>'+esc(d.stage)+'</b></div></div>').join(""):'<div class="card empty">No acquisitions or sales tracked yet.</div>')+'</div>'}
function renovations(){setHeader("Renovations","Budgets, contractors, projects and completion status.");content.innerHTML='<div class="sectionbar"><div></div><button class="btn btn-primary" onclick="addRenovation()">＋ Add Project</button></div><div class="mini-grid">'+(data.renovations.length?data.renovations.map(r=>'<div class="card mini"><div class="panelhead"><div><h3>'+esc(r.name)+'</h3><p>'+esc(prop(r.propertyId)?.name||"")+'</p></div><span class="chip '+(r.status==="Completed"?"good":"warn")+'">'+esc(r.status)+'</span></div><div class="kv"><span>Budget</span><b>'+money(r.budget)+'</b></div><div class="kv"><span>Spent</span><b>'+money(r.spent)+'</b></div><div class="kv"><span>Contractor</span><b>'+esc(r.contractor||"—")+'</b></div></div>').join(""):'<div class="card empty">No renovation projects yet.</div>')+'</div>'}
function financials(){setHeader("Financials","Income, expenses and property-level performance.");const inc=data.payments.filter(x=>x.status==="Paid").reduce((a,b)=>a+(+b.amount||0),0),exp=data.expenses.reduce((a,b)=>a+(+b.amount||0),0);content.innerHTML='<div class="kpis">'+metric("Recorded Income",money(inc),"Paid transactions","$")+metric("Recorded Expenses",money(exp),"Operating expenses","−")+metric("Recorded Net",money(inc-exp),"Income less expenses","↗")+metric("Properties",data.properties.length,"Owned assets","⌂")+'</div><div class="card panel" style="margin-top:16px"><div class="sectionbar"><div><b style="font-size:13px">Expenses</b><div class="rowsub">Repairs, taxes, utilities and more</div></div><button class="btn btn-primary" onclick="addExpense()">＋ Add Expense</button></div>'+expenseTable()+'</div>'}function expenseTable(){return data.expenses.length?'<div class="tablecard"><table><thead><tr><th>Date</th><th>Property</th><th>Category</th><th>Vendor</th><th>Amount</th></tr></thead><tbody>'+data.expenses.map(e=>'<tr><td>'+df(e.date)+'</td><td>'+esc(prop(e.propertyId)?.name||"")+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.vendor||"—")+'</td><td>'+money(e.amount)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No expenses entered yet.</div>'}
function documents(){setHeader("Documents","Contracts, leases, notices, receipts and property records.");content.innerHTML='<div class="sectionbar"><input class="search" placeholder="Search documents"><button class="btn btn-primary" onclick="addDocument()">＋ Add Document</button></div><div class="card tablecard">'+(data.documents.length?'<table><thead><tr><th>Document</th><th>Property</th><th>Type</th><th>Date</th><th>Notes</th></tr></thead><tbody>'+data.documents.map(d=>'<tr><td class="rowtitle">'+esc(d.name)+'</td><td>'+esc(prop(d.propertyId)?.name||"")+'</td><td>'+esc(d.type)+'</td><td>'+df(d.date)+'</td><td>'+esc(d.notes||"—")+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No documents yet.</div>')+'</div>'}
function service(){setHeader("Service Requests","Tenant repair requests and maintenance intake.");
const requests=data.maintenance||[];
content.innerHTML='<div class="sectionbar"><div><b style="font-size:13px">Tenant Repair Requests</b><div class="rowsub">Requests submitted by renters feed directly into maintenance.</div></div><button class="btn btn-primary" onclick="tenantRepairForm()">＋ New Tenant Request</button></div>'+
'<div class="card tablecard">'+(requests.length?'<table><thead><tr><th>Date</th><th>Property</th><th>Unit</th><th>Issue</th><th>Urgency</th><th>Permission</th><th>Status</th></tr></thead><tbody>'+requests.map(m=>'<tr><td>'+df(m.date)+'</td><td>'+esc(prop(m.propertyId)?.name||"")+'</td><td>'+esc(m.unit||"—")+'</td><td><div class="rowtitle">'+esc(m.title||m.category||"Repair request")+'</div><div class="rowsub">'+esc(m.description||"")+'</div></td><td><span class="status '+((m.priority==="Urgent"||m.priority==="Emergency")?"bad":m.priority==="High"?"warn":"good")+'">'+esc(m.priority||"Normal")+'</span></td><td>'+esc(m.permission||"—")+'</td><td><span class="status '+(m.status==="Completed"?"good":m.status==="Open"?"warn":"good")+'">'+esc(m.status||"Open")+'</span></td></tr>').join("")+'</tbody></table>':'<div class="empty">No service requests yet.</div>')+'</div>'}
function tenantRepairForm(){modal("Tenant Service Request","REPAIR REQUEST",
select(currentRole==="tenant"?"Property":"Property","propertyId",opts(data.properties))+
field("Unit / Apartment","unit")+
field("Tenant name","tenantName")+
field("Phone","phone")+
field("Email","email","email")+
select("Issue category","category","<option>Plumbing</option><option>Electrical</option><option>Heat / HVAC</option><option>Appliance</option><option>Leak / Water</option><option>Door / Lock</option><option>Pest</option><option>Safety</option><option>Other</option>")+
select("Urgency","priority","<option>Normal</option><option>High</option><option>Urgent</option><option>Emergency</option>")+
select("Permission to enter","permission","<option>Yes, landlord/repair person may enter</option><option>Contact me first</option><option>No entry without me present</option>")+
select("Preferred contact","contactMethod","<option>Text</option><option>Phone</option><option>Email</option>")+
area("Describe the problem","description"),
o=>{data.maintenance.unshift({id:uid("m"),date:new Date().toISOString().slice(0,10),status:"Open",source:"Tenant",title:o.category+" repair request",...o});save();setView("service")})}
function tenantHome(){setHeader("Tenant Portal","Request repairs and follow the status of your maintenance requests.");const requests=(data.maintenance||[]).filter(x=>x.source==="Tenant");content.innerHTML='<div class="grid2"><div class="card panel"><div class="panelhead"><div><h3>Need something repaired?</h3><p>Submit a maintenance request directly to property management.</p></div></div><button class="btn btn-primary" onclick="tenantRepairForm()">＋ Request a Repair</button></div><div class="card panel"><div class="panelhead"><div><h3>Your Requests</h3><p>Track open and completed service requests.</p></div><span class="chip">'+requests.length+' requests</span></div>'+simpleList(requests,x=>x.title||"Repair request",x=>(x.status||"Open")+' · '+df(x.date))+'</div></div>'}
function tenantService(){setHeader("Maintenance Requests","Submit a repair request or check its status.");const requests=(data.maintenance||[]).filter(x=>x.source==="Tenant");content.innerHTML='<div class="sectionbar"><div><b style="font-size:13px">My Maintenance Requests</b><div class="rowsub">Only repair requests are available in the tenant portal.</div></div><button class="btn btn-primary" onclick="tenantRepairForm()">＋ New Request</button></div><div class="card tablecard">'+(requests.length?'<table><thead><tr><th>Date</th><th>Issue</th><th>Urgency</th><th>Status</th></tr></thead><tbody>'+requests.map(m=>'<tr><td>'+df(m.date)+'</td><td><div class="rowtitle">'+esc(m.title||"Repair request")+'</div><div class="rowsub">'+esc(m.description||"")+'</div></td><td>'+esc(m.priority||"Normal")+'</td><td><span class="status '+(m.status==="Completed"?"good":"warn")+'">'+esc(m.status||"Open")+'</span></td></tr>').join("")+'</tbody></table>':'<div class="empty">No maintenance requests yet.</div>')+'</div>'}
function cameras(){setHeader("Cameras","Owner-only property camera dashboard.");content.innerHTML='<div class="card panel"><div class="panelhead"><div><h3>Camera Integrations</h3><p>Reserved for owner/admin access only.</p></div><span class="chip">Coming soon</span></div><div class="empty">This area is intentionally not available to tenant accounts. Future Ring or other supported camera integrations can be connected here.</div></div>'}
function switchRole(role){currentRole=role;localStorage.setItem("propertyworks_role",role);view=role==="tenant"?"tenantHome":"overview";render()}
function render(){navRender();const routes=currentRole==="tenant"?{tenantHome,tenantService}:{overview,properties,rentals,service,cameras,deals,renovations,financials,documents};(routes[view]|| (currentRole==="tenant"?tenantHome:overview))()}function setView(v){view=v;render()}
function opts(arr){return arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("")}function field(label,name,type="text",extra=""){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+extra+'></div>'}function select(label,name,options){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+options+'</select></div>'}function area(label,name){return '<div class="field full"><label>'+label+'</label><textarea name="'+name+'"></textarea></div>'}function modal(title,eyebrow,body,fn){modalTitle.textContent=title;modalEyebrow.textContent=eyebrow;modalBody.innerHTML='<div class="formgrid">'+body+'</div>';dlg.showModal();form.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target).entries()));dlg.close()}}
function quickAdd(){modal("What do you want to add?","QUICK ADD",select("Record type","kind",'<option value="property">Property</option><option value="payment">Rent payment</option><option value="tenant">Tenant</option><option value="lease">Lease</option><option value="service">Tenant service request</option><option value="deal">Buy/Sell deal</option><option value="reno">Renovation</option><option value="expense">Expense</option><option value="document">Document</option>'),o=>setTimeout(()=>({property:addProperty,payment:addPayment,tenant:addTenant,lease:addLease,service:tenantRepairForm,deal:addDeal,reno:addRenovation,expense:addExpense,document:addDocument}[o.kind]()),40))}
function addProperty(){modal("Add Property","PROPERTY",field("Name","name")+field("Address","address")+field("Type","type")+field("Units","units","number",'min="1" value="1"')+field("Occupied units","occupied","number",'min="0" value="0"')+field("Monthly rent","rent","number",'min="0"'),o=>{data.properties.push({id:uid("p"),...o,units:+o.units,occupied:+o.occupied,rent:+o.rent||0});save()})}
function addTenant(){modal("Add Tenant","RENTALS",field("Full name","name")+select("Property","propertyId",opts(data.properties))+field("Unit","unit")+field("Phone","phone")+field("Email","email","email"),o=>{data.tenants.push({id:uid("t"),...o});save()})}
function addLease(){modal("Add Lease","RENTALS",select("Tenant","tenantId",opts(data.tenants))+select("Property","propertyId",opts(data.properties))+field("Unit","unit")+field("Rent","rent","number")+field("Start","start","date")+field("End","end","date")+select("Status","status","<option>Active</option><option>Pending</option><option>Ended</option>"),o=>{data.leases.push({id:uid("l"),...o,rent:+o.rent||0});save()})}
function addPayment(){modal("Record Payment","RENT",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+select("Tenant","tenantId",opts(data.tenants))+select("Source","source","<option>Tenant</option><option>Section 8</option><option>CityFHEPS</option><option>Other Agency</option>")+field("Amount","amount","number")+select("Status","status","<option>Paid</option><option>Pending</option><option>Late</option>"),o=>{data.payments.unshift({id:uid("pay"),...o,amount:+o.amount||0});save()})}
function addMaintenance(){modal("Add Maintenance","WORK ORDER",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+field("Unit / Area","unit")+field("Issue","title")+select("Priority","priority","<option>Normal</option><option>High</option><option>Urgent</option>")+select("Status","status","<option>Open</option><option>Scheduled</option><option>In Progress</option><option>Completed</option>"),o=>{data.maintenance.unshift({id:uid("m"),...o});save()})}
function addDeal(){modal("Add Buy/Sell Deal","DEAL",field("Deal name","name")+select("Type","type","<option>Acquisition</option><option>Sale</option>")+field("Address","address")+field("Price / Target","price","number")+select("Stage","stage","<option>Researching</option><option>Offer</option><option>Under Contract</option><option>Closing</option><option>Closed</option>"),o=>{data.deals.unshift({id:uid("deal"),...o,price:+o.price||0});save()})}
function addRenovation(){modal("Add Renovation Project","PROJECT",field("Project name","name")+select("Property","propertyId",opts(data.properties))+field("Budget","budget","number")+field("Spent","spent","number")+field("Contractor","contractor")+select("Status","status","<option>Planning</option><option>In Progress</option><option>On Hold</option><option>Completed</option>"),o=>{data.renovations.unshift({id:uid("r"),...o,budget:+o.budget||0,spent:+o.spent||0});save()})}
function addExpense(){modal("Add Expense","FINANCIALS",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+select("Category","category","<option>Repairs & Maintenance</option><option>Utilities</option><option>Insurance</option><option>Property Tax</option><option>Mortgage Interest</option><option>Legal / Professional</option><option>Other</option>")+field("Vendor","vendor")+field("Amount","amount","number"),o=>{data.expenses.unshift({id:uid("e"),...o,amount:+o.amount||0});save()})}
function addDocument(){modal("Add Document","DOCUMENT",field("Name","name")+select("Property","propertyId",opts(data.properties))+select("Type","type","<option>Lease</option><option>Contract</option><option>Notice</option><option>Receipt / Invoice</option><option>Insurance</option><option>Tax</option><option>Other</option>")+field("Date","date","date")+area("Notes","notes"),o=>{data.documents.unshift({id:uid("d"),...o});save()})}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="propertyworks-backup.json";a.click()}if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}render();
</script>
</body></html>
