<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PropertyWorks">
<link rel="manifest" href="./manifest.webmanifest">
<title>PropertyWorks</title>
<style>
:root{--navy:#0f1b2d;--ink:#152033;--muted:#748095;--line:#e7ebf1;--bg:#f5f7fa;--blue:#2d6cdf;--green:#16825d;--amber:#c47b10;--red:#c34747;--shadow:0 10px 28px rgba(24,39,75,.07)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0f1b2d,#0a1422);color:#fff;padding:22px 15px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;border-bottom:1px solid rgba(255,255,255,.08)}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4c8cff,#2357bd);display:grid;place-items:center;font-weight:800}.brand b{font-size:16px}.brand small{display:block;color:#90a0ba;margin-top:2px}
nav{display:grid;gap:6px;margin-top:18px}.nav{border:0;background:transparent;color:#abb8ca;text-align:left;padding:11px 12px;border-radius:10px}.nav.active,.nav:hover{background:rgba(255,255,255,.08);color:#fff}.aside-foot{margin-top:auto}.portfolio-chip{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);border-radius:12px;padding:13px}.portfolio-chip small{color:#8797ad}.portfolio-chip b{display:block;margin-top:4px}
main{min-width:0}.top{height:90px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}
.primary,.secondary{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#edf1f6;color:#334155}
#content{padding:26px 32px 48px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.metric{padding:17px}.metric label{font-size:11px;color:var(--muted);font-weight:700}.metric strong{display:block;font-size:28px;margin-top:10px}.metric small{color:var(--muted)}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.grid2{display:grid;grid-template-columns:1.4fr .8fr;gap:16px;margin-top:16px}.panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.head h3{margin:0;font-size:15px}.head p{margin:4px 0 0;color:var(--muted);font-size:10px}.pill{font-size:10px;padding:5px 8px;border-radius:999px;background:#eef3f9;color:#526176;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}.card{padding:16px}.card h3{margin:0;font-size:15px}.sub{font-size:10px;color:var(--muted);margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.stat{background:#f7f9fc;padding:9px;border-radius:9px}.stat b{display:block;font-size:13px}.stat span{font-size:9px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12px}th{padding:9px;text-align:left;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td{padding:11px 9px;border-bottom:1px solid var(--line)}.status{padding:5px 8px;border-radius:999px;font-size:9px;font-weight:700;background:#eef3f9}.status.active,.status.paid,.status.completed{background:#e9f7f1;color:var(--green)}.status.open,.status.pending,.status.planning{background:#fff4e2;color:var(--amber)}.status.late,.status.urgent{background:#fdecec;color:var(--red)}
.bar-area{height:210px;display:flex;align-items:flex-end;gap:12px;padding:20px 5px 0;border-bottom:1px solid var(--line)}.bar-group{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;position:relative}.bar{width:17px;border-radius:5px 5px 0 0}.income{background:#2d6cdf}.expense{background:#bdc9df}.month{position:absolute;bottom:-18px;font-size:9px;color:var(--muted)}.legend{margin-top:24px;font-size:10px;color:var(--muted)}
.actions{display:grid;gap:9px}.action{padding:11px;border:1px solid var(--line);border-radius:10px}.action b{font-size:11px}.action small{display:block;color:var(--muted);margin-top:3px}
.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:220px}.empty{text-align:center;color:var(--muted);padding:35px;font-size:12px}.danger{border:0;background:transparent;color:var(--red);font-size:10px}
dialog{width:min(650px,92vw);border:0;border-radius:17px;padding:0;box-shadow:0 28px 80px rgba(15,27,45,.25)}dialog::backdrop{background:rgba(15,27,45,.5)}form{padding:20px}.modal-head{display:flex;justify-content:space-between}.modal-head h2{margin:0}.close{border:0;background:#eef2f6;border-radius:9px;width:32px;height:32px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px}.field textarea{min-height:80px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:980px){.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.app{display:block}aside{height:auto;position:relative;padding:12px}.brand{padding-bottom:12px}nav{display:flex;overflow-x:auto;margin-top:10px}.nav{white-space:nowrap}.aside-foot{display:none}.top{height:auto;padding:15px 16px;position:relative}.top h1{font-size:19px}.top p{display:none}#content{padding:16px}.metrics,.cards{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{width:100%;min-width:0}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand"><div class="logo">PW</div><div><b>PropertyWorks</b><small>Real Estate Command Center</small></div></div>
<nav>
<button class="nav active" data-view="overview">⌂ Overview</button>
<button class="nav" data-view="portfolio">▦ Portfolio</button>
<button class="nav" data-view="rentals">$ Rentals</button>
<button class="nav" data-view="deals">◆ Buy & Sell</button>
<button class="nav" data-view="renovations">⚒ Renovations</button>
<button class="nav" data-view="documents">▣ Documents</button>
<button class="nav" data-view="reports">↗ Reports</button>
</nav>
<div class="aside-foot"><div class="portfolio-chip"><small>Current portfolio</small><b>Staten Island</b><small>3 properties · 7 units</small></div></div>
</aside>
<main>
<header class="top"><div><h1 id="title">Portfolio Overview</h1><p id="subtitle">Manage. Buy. Sell. Renovate. Grow.</p></div><button id="addBtn" class="primary">＋ Add New</button></header>
<section id="content"></section>
</main>
</div>
<dialog id="modal"><form id="modalForm" method="dialog"><div class="modal-head"><h2 id="modalTitle">Add</h2><button class="close" value="cancel">×</button></div><div id="fields"></div><div class="modal-actions"><button class="secondary" value="cancel">Cancel</button><button class="primary" value="default">Save</button></div></form></dialog>
<script>
const KEY="propertyworks_v1";
const seed={properties:[
{id:"p1",name:"62 Fillmore",address:"62 Fillmore Street, Staten Island, NY",type:"Two-Family",units:2,occupied:2,rent:7600,status:"Rental"},
{id:"p2",name:"48 Jackson",address:"48 Jackson Street, Staten Island, NY",type:"Two-Family",units:2,occupied:2,rent:0,status:"Rental"},
{id:"p3",name:"354 Hoyt",address:"354 Hoyt Avenue, Staten Island, NY",type:"Multi-Family",units:3,occupied:3,rent:0,status:"Rental"}],
tenants:[],payments:[],deals:[],renovations:[{id:"r1",propertyId:"p1",name:"Common-area compliance check",budget:0,spent:0,status:"Planning"}],documents:[{id:"d1",propertyId:"p3",name:"Fully Executed Contract of Sale",type:"Contract",date:"2026-09-14"}],expenses:[],
chart:[{m:"Apr",i:14500,e:6600},{m:"May",i:15800,e:7000},{m:"Jun",i:16600,e:7400},{m:"Jul",i:17200,e:7200},{m:"Aug",i:18000,e:7600},{m:"Sep",i:18000,e:7900}]};
let data=load(),view="overview";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
const $=x=>document.getElementById(x), money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(+n||0), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])), uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), prop=id=>data.properties.find(p=>p.id===id);
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render()});
$("addBtn").onclick=quickAdd;
function metric(l,v,s){return '<div class="metric"><label>'+l+'</label><strong>'+v+'</strong><small>'+s+'</small></div>'}
function overview(){$("title").textContent="Portfolio Overview";$("subtitle").textContent="Manage. Buy. Sell. Renovate. Grow.";let units=data.properties.reduce((a,p)=>a+p.units,0),occ=data.properties.reduce((a,p)=>a+p.occupied,0),income=data.payments.filter(p=>p.status==="Paid").reduce((a,p)=>a+(+p.amount||0),0)||18000,ren=data.renovations.filter(r=>r.status!=="Completed").length;
$("content").innerHTML='<div class="metrics">'+metric("Monthly Rental Income",money(income),'Portfolio cash inflow')+metric("Occupancy",Math.round(occ/units*100)+"%",occ+" of "+units+" units occupied")+metric("Active Renovations",ren,"Projects in progress/planning")+metric("Properties",data.properties.length,"Rental & investment assets")+'</div><div class="grid2"><div class="panel"><div class="head"><div><h3>Portfolio Cash Flow</h3><p>Income vs expenses</p></div><span class="pill">Last 6 months</span></div>'+chart()+'</div><div class="panel"><div class="head"><div><h3>PropertyWorks Focus</h3><p>Your active real-estate workflow</p></div></div><div class="actions"><div class="action"><b>Rentals</b><small>Track tenants, rent and occupancy.</small></div><div class="action"><b>Buy & Sell</b><small>Track acquisitions, listings and deal stages.</small></div><div class="action"><b>Renovations</b><small>Track budget, spend and project status.</small></div></div></div></div><div class="cards">'+data.properties.map(propertyCard).join("")+'</div>'}
function chart(){let max=Math.max(...data.chart.flatMap(x=>[x.i,x.e]));return '<div class="bar-area">'+data.chart.map(x=>'<div class="bar-group"><div class="bar income" style="height:'+Math.round(x.i/max*100)+'%"></div><div class="bar expense" style="height:'+Math.round(x.e/max*100)+'%"></div><div class="month">'+x.m+'</div></div>').join("")+'</div><div class="legend">■ Income &nbsp;&nbsp; ▪ Expenses</div>'}
function propertyCard(p){return '<div class="card"><div class="head"><div><h3>'+esc(p.name)+'</h3><p>'+esc(p.address)+'</p></div><span class="pill">'+esc(p.status)+'</span></div><div class="stats"><div class="stat"><b>'+p.units+'</b><span>Units</span></div><div class="stat"><b>'+p.occupied+'</b><span>Occupied</span></div><div class="stat"><b>'+money(p.rent)+'</b><span>Rent/mo</span></div></div></div>'}
function portfolio(){$("title").textContent="Portfolio";$("subtitle").textContent="All owned and managed real estate."; $("content").innerHTML='<div class="toolbar"><input class="search" placeholder="Search properties"><button class="primary" onclick="addProperty()">＋ Add Property</button></div><div class="cards">'+data.properties.map(p=>propertyCard(p)).join("")+'</div>'}
function rentals(){$("title").textContent="Rentals";$("subtitle").textContent="Tenants, payments and rental performance."; $("content").innerHTML='<div class="metrics">'+metric("Collected",money(data.payments.filter(x=>x.status==="Paid").reduce((a,b)=>a+(+b.amount||0),0)),"Recorded payments")+metric("Tenants",data.tenants.length,"Tenant records")+metric("Transactions",data.payments.length,"Rent ledger")+metric("Occupied Units",data.properties.reduce((a,p)=>a+p.occupied,0),"Across portfolio")+'</div><div class="panel" style="margin-top:16px"><div class="toolbar"><button class="secondary" onclick="addTenant()">＋ Tenant</button><button class="primary" onclick="addPayment()">＋ Payment</button></div>'+paymentTable()+'</div>'}
function paymentTable(){if(!data.payments.length)return '<div class="empty">No rent payments yet. Add your first payment.</div>';return '<table><thead><tr><th>Date</th><th>Property</th><th>Tenant</th><th>Source</th><th>Amount</th><th>Status</th></tr></thead><tbody>'+data.payments.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(prop(p.propertyId)?.name||"")+'</td><td>'+esc(p.tenant||"—")+'</td><td>'+esc(p.source)+'</td><td>'+money(p.amount)+'</td><td><span class="status '+p.status.toLowerCase()+'">'+esc(p.status)+'</span></td></tr>').join("")+'</tbody></table>'}
function deals(){$("title").textContent="Buy & Sell";$("subtitle").textContent="Acquisitions, listings and transaction pipeline."; $("content").innerHTML='<div class="toolbar"><input class="search" placeholder="Search deals"><button class="primary" onclick="addDeal()">＋ New Deal</button></div><div class="cards">'+(data.deals.length?data.deals.map(d=>'<div class="card"><div class="head"><div><h3>'+esc(d.name)+'</h3><p>'+esc(d.type)+' · '+esc(d.stage)+'</p></div><span class="pill">'+money(d.price)+'</span></div><div class="sub">'+esc(d.notes||"")+'</div></div>').join(""):'<div class="card empty">No active acquisitions or listings yet.</div>')+'</div>'}
function renovations(){$("title").textContent="Renovations";$("subtitle").textContent="Plan projects, budgets and construction spend."; $("content").innerHTML='<div class="toolbar"><input class="search" placeholder="Search projects"><button class="primary" onclick="addRenovation()">＋ New Project</button></div><div class="cards">'+data.renovations.map(r=>'<div class="card"><div class="head"><div><h3>'+esc(r.name)+'</h3><p>'+esc(prop(r.propertyId)?.name||"")+'</p></div><span class="status '+r.status.toLowerCase()+'">'+esc(r.status)+'</span></div><div class="stats"><div class="stat"><b>'+money(r.budget)+'</b><span>Budget</span></div><div class="stat"><b>'+money(r.spent)+'</b><span>Spent</span></div><div class="stat"><b>'+money((+r.budget||0)-(+r.spent||0))+'</b><span>Remaining</span></div></div></div>').join("")+'</div>'}
function documents(){$("title").textContent="Documents";$("subtitle").textContent="Contracts, leases, notices, receipts and property records."; $("content").innerHTML='<div class="toolbar"><input class="search" placeholder="Search documents"><button class="primary" onclick="addDocument()">＋ Add Document</button></div><div class="panel">'+(data.documents.length?'<table><thead><tr><th>Document</th><th>Property</th><th>Type</th><th>Date</th></tr></thead><tbody>'+data.documents.map(d=>'<tr><td><b>'+esc(d.name)+'</b></td><td>'+esc(prop(d.propertyId)?.name||"")+'</td><td>'+esc(d.type)+'</td><td>'+esc(d.date||"—")+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No documents yet.</div>')+'</div>'}
function reports(){$("title").textContent="Reports";$("subtitle").textContent="Property-level income, expenses and renovation budgets.";let inc=data.payments.filter(x=>x.status==="Paid").reduce((a,b)=>a+(+b.amount||0),0),exp=data.expenses.reduce((a,b)=>a+(+b.amount||0),0);$("content").innerHTML='<div class="metrics">'+metric("Recorded Income",money(inc),"Rent ledger")+metric("Recorded Expenses",money(exp),"Property expenses")+metric("Recorded Net",money(inc-exp),"Income less expenses")+metric("Renovation Budget",money(data.renovations.reduce((a,r)=>a+(+r.budget||0),0)),"All projects")+'</div>'}
function render(){({overview,portfolio,rentals,deals,renovations,documents,reports}[view]||overview)()}
function opts(){return data.properties.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")}
function field(l,n,t="text"){return '<div class="field"><label>'+l+'</label><input name="'+n+'" type="'+t+'"></div>'} function select(l,n,o){return '<div class="field"><label>'+l+'</label><select name="'+n+'">'+o+'</select></div>'} function area(l,n){return '<div class="field full"><label>'+l+'</label><textarea name="'+n+'"></textarea></div>'}
function modal(t,b,fn){$("modalTitle").textContent=t;$("fields").innerHTML='<div class="form-grid">'+b+'</div>';$("modal").showModal();$("modalForm").onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target).entries()));$("modal").close()}}
function quickAdd(){modal("Add to PropertyWorks",select("Type","kind",'<option value="property">Property</option><option value="payment">Rent Payment</option><option value="deal">Buy/Sell Deal</option><option value="renovation">Renovation</option><option value="document">Document</option>'),o=>setTimeout(()=>({property:addProperty,payment:addPayment,deal:addDeal,renovation:addRenovation,document:addDocument}[o.kind]()),40))}
window.addProperty=()=>modal("Add Property",field("Property name","name")+field("Address","address")+field("Type","type")+field("Units","units","number")+field("Occupied units","occupied","number")+field("Monthly rent","rent","number"),o=>{data.properties.push({id:uid("p"),...o,units:+o.units||1,occupied:+o.occupied||0,rent:+o.rent||0,status:"Rental"});save()});
window.addTenant=()=>modal("Add Tenant",field("Tenant name","name")+select("Property","propertyId",opts())+field("Unit","unit")+field("Phone","phone")+field("Email","email","email"),o=>{data.tenants.push({id:uid("t"),...o});save()});
window.addPayment=()=>modal("Record Payment",field("Date","date","date")+select("Property","propertyId",opts())+field("Tenant","tenant")+select("Source","source",'<option>Tenant</option><option>Section 8</option><option>CityFHEPS</option><option>Other</option>')+field("Amount","amount","number")+select("Status","status",'<option>Paid</option><option>Pending</option><option>Late</option>'),o=>{data.payments.unshift({id:uid("pay"),...o,amount:+o.amount||0});save()});
window.addDeal=()=>modal("New Buy / Sell Deal",field("Property / deal name","name")+select("Type","type",'<option>Purchase</option><option>Sale</option><option>1031 Exchange</option>')+field("Price","price","number")+select("Stage","stage",'<option>Research</option><option>Offer</option><option>Under Contract</option><option>Closing</option><option>Listed</option>')+area("Notes","notes"),o=>{data.deals.unshift({id:uid("deal"),...o,price:+o.price||0});save()});
window.addRenovation=()=>modal("New Renovation Project",select("Property","propertyId",opts())+field("Project name","name")+field("Budget","budget","number")+field("Spent","spent","number")+select("Status","status",'<option>Planning</option><option>Active</option><option>Completed</option>'),o=>{data.renovations.unshift({id:uid("r"),...o,budget:+o.budget||0,spent:+o.spent||0});save()});
window.addDocument=()=>modal("Add Document Record",field("Document name","name")+select("Property","propertyId",opts())+select("Type","type",'<option>Contract</option><option>Lease</option><option>Notice</option><option>Receipt</option><option>Inspection</option><option>Insurance</option><option>Tax</option><option>Other</option>')+field("Date","date","date"),o=>{data.documents.unshift({id:uid("d"),...o});save()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}
render();
</script>
</body></html>
