<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">PW</div><div><h1>PropertyWorks</h1><small>Real Estate Command Center</small></div></div><nav class="nav" id="desktopNav"></nav><div class="sidefoot"><div class="portfolio-mini"><b>Staten Island Portfolio</b><p>Manage · Buy · Sell · Renovate · Grow</p></div></div></aside>
<main class="main"><header class="topbar"><div><h2 id="pageTitle">Overview</h2><p id="pageSub">Your entire real estate operation in one place.</p></div><div class="actions"><button id="cloudBtn" class="btn btn-soft" onclick="cloudAccountModal()">☁ Cloud</button><select id="roleSelect" class="role-select" onchange="switchRole(this.value)"><option value="owner">Owner / Admin</option><option value="tenant">Tenant View</option><option value="contractor">Technician / Handyman</option></select><button id="exportBtn" class="btn btn-soft" onclick="exportData()">Export</button><button id="addNewBtn" class="btn btn-primary" onclick="quickAdd()">＋ Add New</button></div></header><section class="content" id="content"></section></main>

<script>
const KEY="propertyworks_v3";
const SUPABASE_URL="https://enxdxvwrkuikivkkewyn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_ghGJ8MN9flcJafOSeDbwNQ_7kO7Jc10";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let cloudUser=null;
const seed={properties:[{id:"p1",name:"62 Fillmore",address:"62 Fillmore Street, Staten Island, NY 10301",type:"Two-Family",units:2,occupied:2,rent:7600},{id:"p2",name:"48 Jackson",address:"48 Jackson Street, Staten Island, NY",type:"Two-Family",units:2,occupied:2,rent:0},{id:"p3",name:"354 Hoyt",address:"354 Hoyt Avenue, Staten Island, NY",type:"Multi-Family",units:3,occupied:3,rent:0}],tenants:[],leases:[],payments:[],expenses:[],maintenance:[{id:"m1",propertyId:"p1",title:"Common-area safety check",unit:"Common",priority:"High",status:"Open",date:"2026-09-14"}],deals:[],renovations:[],documents:[{id:"d1",propertyId:"p3",name:"Fully Executed Contract of Sale",type:"Contract",date:"2026-09-14",notes:"354 Hoyt Avenue"}],chart:[{m:"Apr",i:14500,e:6600},{m:"May",i:15800,e:7000},{m:"Jun",i:16600,e:7400},{m:"Jul",i:17200,e:7200},{m:"Aug",i:18000,e:7600},{m:"Sep",i:18000,e:7900}],contractors:[],bids:[]};
let data=load(),view="overview",currentRole=localStorage.getItem("propertyworks_role")||"owner"; data.contractors=data.contractors||[]; data.bids=data.bids||[]; data.notifications=data.notifications||[]; data.generatedLeases=data.generatedLeases||[]; data.automation=data.automation||{autoNotifyContractors:true,autoPrepareSocial:true,autoNotifyOwner:true,autoNotifyTenant:true}; const AUTHKEY="propertyworks_auth_v1"; let authData=loadAuth(); let tenantSession=JSON.parse(localStorage.getItem("propertyworks_tenant_session")||"null"); function loadAuth(){try{return JSON.parse(localStorage.getItem(AUTHKEY))||{invites:[],accounts:[]}}catch(e){return {invites:[],accounts:[]}}} function saveAuth(){localStorage.setItem(AUTHKEY,JSON.stringify(authData))}function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),prop=id=>data.properties.find(x=>x.id===id),tenant=id=>data.tenants.find(x=>x.id===id),df=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";
const ownerNav=[["overview","⌂","Overview"],["properties","▦","Properties"],["rentals","$","Rentals"],["leaseGenerator","✎","Lease Generator"],["tenantAccounts","👤","Tenant Accounts"],["service","🛠","Service Requests"],["marketplace","⚒","Maintenance Marketplace"],["notifications","🔔","Notifications"],["automation","✦","Automation Agent"],["cameras","◉","Cameras"],["deals","↕","Buy & Sell"],["renovations","◇","Renovations"],["financials","↗","Financials"],["reports","▤","Reports & Tax Export"],["documents","▣","Documents"]]; const tenantNav=[["tenantHome","⌂","Home"],["tenantService","🛠","Maintenance"],["notifications","🔔","Notifications"]]; const contractorNav=[["contractorHome","⌂","Available Jobs"],["contractorMyJobs","⚒","My Jobs"],["contractorProfile","👤","Profile"],["notifications","🔔","Notifications"]];
function navRender(){
  const nav=currentRole==="tenant"?(tenantSession?tenantNav:[]):currentRole==="contractor"?contractorNav:ownerNav;
  document.getElementById("desktopNav").innerHTML=nav.map(n=>'<button class="navbtn '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join("");
  document.getElementById("mobileNav").innerHTML=nav.slice(0,5).map(n=>'<button class="mnav '+(view===n[0]?'active':'')+'" onclick="setView(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>').join("");
  const rs=document.getElementById("roleSelect");
  const eb=document.getElementById("exportBtn");
  const ab=document.getElementById("addNewBtn");
  if(rs) rs.value=currentRole;
  if(eb) eb.style.display=currentRole==="owner"?"":"none";
  if(ab){
    ab.textContent=currentRole==="tenant"?(tenantSession?"＋ Request Repair":"Sign In"):currentRole==="contractor"?"＋ Contractor Profile":"＋ Add New";
    ab.onclick=currentRole==="tenant"?(tenantSession?tenantRepairForm:tenantLoginModal):currentRole==="contractor"?contractorProfileForm:quickAdd;
  }
}
function setHeader(t,s){pageTitle.textContent=t;pageSub.textContent=s}
async function initCloud(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  cloudUser=session?.user||null;
  updateCloudButton();
  if(cloudUser){
    subscribeRealtime();
  }
}
function updateCloudButton(){
  const b=document.getElementById("cloudBtn"); if(!b)return;
  b.textContent=cloudUser?"☁ Synced":"☁ Cloud";
  b.style.background=cloudUser?"#e8f5ef":"";
  b.style.color=cloudUser?"#176b4d":"";
}
function cloudAccountModal(){
  if(cloudUser){cloudConnectedModal();return}
  modal("PropertyWorks Cloud","SECURE ACCOUNT",
    field("Email","email","email")+field("Password","password","password")+
    '<div class="field full"><div class="privacy-note">Sign in to sync PropertyWorks across your iPhone, iPad and computer. Your password is handled by Supabase Auth and is not stored in PropertyWorks.</div></div><div class="field full"><button type="button" class="btn btn-soft" onclick="cloudCreateAccount()">Create Cloud Account</button></div>',
    async o=>{await cloudSignIn(o.email,o.password)}
  )
}
async function cloudSignIn(email,password){
  const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.trim(),password});
  if(error){alert(error.message+"\n\nIf this is your first time, use Create Cloud Account.");return}
  cloudUser=data.user; updateCloudButton(); subscribeRealtime(); alert("PropertyWorks Cloud connected."); await cloudPullOwnerData();
}
async function cloudCreateAccount(){
  modal("Create Cloud Account","PROPERTYWORKS CLOUD",
    field("Full name","fullName")+field("Email","email","email")+field("Password","password","password"),
    async o=>{
      if((o.password||"").length<8){alert("Use a password with at least 8 characters.");return}
      const {data,error}=await supabaseClient.auth.signUp({email:o.email.trim(),password:o.password});
      if(error){alert(error.message);return}
      if(data.user){
        cloudUser=data.user;
        await supabaseClient.from("profiles").upsert({id:data.user.id,full_name:o.fullName,role:"owner"});
        updateCloudButton();
      }
      alert(data.session?"Cloud account created.":"Cloud account created. Check your email to confirm it, then sign in.");
    }
  )
}
function cloudConnectedModal(){
  modal("PropertyWorks Cloud","CONNECTED",
    '<div class="field full"><div class="privacy-note"><b>'+esc(cloudUser?.email||"")+'</b><br>Cloud database, authentication and storage are connected.</div></div>'+
    '<div class="field full"><button type="button" class="btn btn-primary" onclick="cloudPushLocalData()">Upload Current Portfolio to Cloud</button></div>'+
    '<div class="field full"><button type="button" class="btn btn-soft" onclick="cloudPullOwnerData()">Refresh From Cloud</button></div>'+
    '<div class="field full"><button type="button" class="btn btn-soft" onclick="cloudSignOut()">Sign Out</button></div>',
    ()=>{}
  )
}
async function cloudSignOut(){await supabaseClient.auth.signOut();cloudUser=null;updateCloudButton();document.getElementById("dlg").close();alert("Signed out of PropertyWorks Cloud.")}
async function cloudPushLocalData(){
  if(!cloudUser){alert("Sign in first.");return}
  const ownerId=cloudUser.id;
  const idMap={};
  for(const p of data.properties){
    const row={owner_id:ownerId,name:p.name,address:p.address,property_type:p.type||null,units:+p.units||1,occupied_units:+p.occupied||0,scheduled_monthly_rent:+p.rent||0};
    let result;
    if(String(p.id).includes("-")&&String(p.id).length>30){
      result=await supabaseClient.from("properties").upsert({id:p.id,...row}).select().single();
    }else{
      result=await supabaseClient.from("properties").insert(row).select().single();
    }
    if(result.error){alert("Property sync error: "+result.error.message);return}
    idMap[p.id]=result.data.id; p.id=result.data.id;
  }
  const mapped=id=>idMap[id]||id;
  for(const x of data.payments){
    const row={owner_id:ownerId,property_id:mapped(x.propertyId),unit:x.unit||null,payment_date:x.date||new Date().toISOString().slice(0,10),source:x.source||"Tenant",amount:+x.amount||0,status:x.status||"Paid",notes:x.notes||null};
    await supabaseClient.from("payments").insert(row);
  }
  for(const x of data.expenses){

async function cloudPullOwnerData(){
  if(!cloudUser)return;
  const ownerId=cloudUser.id;
  const [pr,pa,ex,mr,re,de]=await Promise.all([
    supabaseClient.from("properties").select("*").eq("owner_id",ownerId).order("created_at"),
    supabaseClient.from("payments").select("*").eq("owner_id",ownerId).order("payment_date",{ascending:false}),
    supabaseClient.from("expenses").select("*").eq("owner_id",ownerId).order("expense_date",{ascending:false}),
    supabaseClient.from("maintenance_requests").select("*").eq("owner_id",ownerId).order("created_at",{ascending:false}),
    supabaseClient.from("renovations").select("*").eq("owner_id",ownerId).order("created_at",{ascending:false}),
    supabaseClient.from("deals").select("*").eq("owner_id",ownerId).order("created_at",{ascending:false})
  ]);
  const err=[pr,pa,ex,mr,re,de].find(x=>x.error)?.error;
  if(err){console.error(err);return}
  if(pr.data?.length)data.properties=pr.data.map(p=>({id:p.id,name:p.name,address:p.address,type:p.property_type||"",units:p.units,occupied:p.occupied_units,rent:+p.scheduled_monthly_rent||0}));
  data.payments=(pa.data||[]).map(x=>({id:x.id,propertyId:x.property_id,date:x.payment_date,source:x.source,amount:+x.amount||0,status:x.status,unit:x.unit||"",notes:x.notes||""}));
  data.expenses=(ex.data||[]).map(x=>({id:x.id,propertyId:x.property_id,date:x.expense_date,category:x.category,vendor:x.vendor||"",amount:+x.amount||0,description:x.description||""}));
  data.maintenance=(mr.data||[]).map(x=>({id:x.id,propertyId:x.property_id,unit:x.unit||"",title:x.title,description:x.description||"",priority:x.priority,status:x.status,marketplaceStatus:x.marketplace_status,paymentStatus:x.payment_status,paymentMethod:x.payment_method}));
  data.renovations=(re.data||[]).map(x=>({id:x.id,propertyId:x.property_id,name:x.name,budget:+x.budget||0,spent:+x.spent||0,contractor:x.contractor||"",status:x.status}));
  data.deals=(de.data||[]).map(x=>({id:x.id,name:x.name,type:x.deal_type||"",address:x.address||"",price:+x.price||0,stage:x.stage||"",notes:x.notes||""}));
  localStorage.setItem(KEY,JSON.stringify(data));render();
}

function exportTaxWorkbook(){
  if(typeof XLSX==="undefined"){alert("Excel export library did not load. Please check your internet connection and try again.");return}
  const wb=XLSX.utils.book_new();
  const paid=data.payments.filter(x=>x.status==="Paid");
  const summary=data.properties.map(p=>{
    const income=paid.filter(x=>x.propertyId===p.id).reduce((a,b)=>a+(+b.amount||0),0);
    const expenses=data.expenses.filter(x=>x.propertyId===p.id).reduce((a,b)=>a+(+b.amount||0),0);
    return {"Property":p.name,"Address":p.address,"Units":+p.units||0,"Occupied Units":+p.occupied||0,"Occupancy %":Math.round((+p.occupied||0)/(+p.units||1)*100),"Recorded Income":income,"Recorded Expenses":expenses,"Net Recorded Cash":income-expenses,"Scheduled Monthly Rent":+p.rent||0}
  });
  const incomeRows=data.payments.map(x=>({"Date":x.date||"","Property":prop(x.propertyId)?.name||"","Tenant":tenant(x.tenantId)?.name||x.tenantName||"","Unit":x.unit||"","Source":x.source||"Tenant","Amount":+x.amount||0,"Status":x.status||""}));
  const expenseRows=data.expenses.map(x=>({"Date":x.date||"","Property":prop(x.propertyId)?.name||"","Category":x.category||"Other","Vendor":x.vendor||"","Amount":+x.amount||0,"Description":x.description||""}));
  const propertyRows=data.properties.map(p=>({"Property":p.name,"Address":p.address,"Type":p.type||"","Units":+p.units||0,"Occupied Units":+p.occupied||0,"Scheduled Monthly Rent":+p.rent||0}));
  const renovationRows=data.renovations.map(r=>({"Property":prop(r.propertyId)?.name||"","Project":r.name||"","Budget":+r.budget||0,"Spent":+r.spent||0,"Remaining":(+r.budget||0)-(+r.spent||0),"Contractor":r.contractor||"","Status":r.status||""}));
  const dealRows=data.deals.map(d=>({"Deal":d.name||"","Type":d.type||"","Address":d.address||"","Price / Target":+d.price||0,"Stage":d.stage||""}));
  [["Portfolio Summary",summary],["Income Ledger",incomeRows],["Expense Ledger",expenseRows],["Property Detail",propertyRows],["Renovations",renovationRows],["Buy-Sell Deals",dealRows]].forEach(([name,rows])=>{
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"No Data":"No records entered"}]);
    ws["!cols"]=Object.keys((rows[0]||{"No Data":""})).map(k=>({wch:Math.min(35,Math.max(12,k.length+4))}));
    XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));
  });
  XLSX.writeFile(wb,"PropertyWorks_Tax_Prep_"+new Date().toISOString().slice(0,10)+".xlsx");
  notifyParty("owner","Excel report exported","PropertyWorks tax-prep workbook was exported successfully.");
}

async function hashPassword(value){const buf=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",buf);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function makeInviteCode(){return Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}

function leaseFormValues(){
  const v=id=>document.getElementById(id)?.value||"";
  return {propertyId:v("leasePropertyId"),landlord:v("leaseLandlord"),landlordAddress:v("leaseLandlordAddress"),tenant:v("leaseTenant"),unit:v("leaseUnit"),start:v("leaseStart"),end:v("leaseEnd"),rent:+v("leaseRent")||0,deposit:+v("leaseDeposit")||0,dueDay:v("leaseDueDay"),lateFee:v("leaseLateFee"),utilities:v("leaseUtilities"),pets:v("leasePets"),smoking:v("leaseSmoking"),goodCause:v("leaseGoodCause"),lead:v("leaseLead"),bedbug:v("leaseBedbug"),extra:v("leaseExtra")};
}
function goodCauseText(v){
  if(v==="small-landlord")return "Landlord states that the unit is exempt from New York Good Cause Eviction coverage based on the small-landlord exemption, subject to the ownership rules in Real Property Law Article 6-A. The current official Good Cause Eviction Law Notice must be attached and completed.";
  if(v==="owner-occupied")return "Landlord states that the unit is exempt from New York Good Cause Eviction coverage because it is in an owner-occupied housing accommodation with no more than 10 residential units. The current official Good Cause Eviction Law Notice must be attached and completed.";
  if(v==="covered")return "Landlord states that the unit is covered by New York Good Cause Eviction. The current official Good Cause Eviction Law Notice must be attached and completed.";
  return "Good Cause Eviction status requires separate review. The current official Good Cause Eviction Law Notice must be attached and completed.";
}
function leaseHtml(o,includeSignatures=false){
  const p=prop(o.propertyId); const addr=p?.address||""; const dep=Math.min(o.deposit,o.rent||o.deposit);
  const sigs=includeSignatures?'<div class="lease-sign"><div><div class="sigline">'+esc(o.landlordSignature||o.landlord||"Landlord")+' — Landlord</div><div class="rowsub">Signed electronically '+esc(o.landlordSignedAt||"")+'</div></div><div><div class="sigline">'+esc(o.tenantSignature||o.tenant||"Tenant")+' — Tenant</div><div class="rowsub">Signed electronically '+esc(o.tenantSignedAt||"")+'</div></div></div>':'';
  return '<h1>NEW YORK CITY RESIDENTIAL LEASE<br><span style="font-size:12px">Market-Rate 1–2 Family Property Template</span></h1>'+
  '<p><b>Landlord:</b> '+esc(o.landlord)+'<br><b>Landlord Notice Address:</b> '+esc(o.landlordAddress)+'<br><b>Tenant(s):</b> '+esc(o.tenant)+'<br><b>Premises:</b> '+esc(addr)+(o.unit?' — Unit '+esc(o.unit):'')+'</p>'+
  '<h2>1. TERM</h2><p>The lease begins on '+esc(df(o.start))+' and ends on '+esc(df(o.end))+'. Tenant shall surrender possession at the end of the term unless the parties enter into a lawful renewal or the tenancy otherwise continues by law.</p>'+
  '<h2>2. RENT</h2><p>Monthly rent is <b>'+money(o.rent)+'</b>, due in advance on the '+esc(o.dueDay)+' day of each month at the payment location or electronic method designated by Landlord. A late fee, if any, may be charged only to the extent permitted by New York law. This lease does not authorize any fee prohibited by law.</p>'+
  '<h2>3. SECURITY DEPOSIT</h2><p>The security deposit is <b>'+money(dep)+'</b>. It shall not exceed one month\'s rent. Handling, inspection, itemization, and return of the deposit will be governed by applicable New York law.</p>'+
  '<h2>4. OCCUPANCY AND USE</h2><p>The premises shall be used only as a private residence by Tenant and lawful occupants identified to Landlord. Tenant shall not use the premises for unlawful activity, create a nuisance, or interfere unreasonably with neighbors or the property.</p>'+
  '<h2>5. UTILITIES</h2><p>Tenant responsibility: '+esc(o.utilities)+'. Landlord remains responsible for any service or utility that cannot lawfully be shifted to Tenant.</p>'+
  '<h2>6. REPAIRS, CLEANLINESS AND DAMAGE</h2><p>Tenant shall keep the apartment reasonably clean, promptly report leaks, unsafe conditions, pests and needed repairs, and be responsible for damage caused by Tenant, occupants, guests or pets beyond ordinary wear and tear. Nothing in this lease waives Landlord\'s statutory duty to maintain habitable premises.</p>'+
  '<h2>7. ACCESS</h2><p>Tenant shall provide reasonable access to Landlord and authorized workers for lawful inspections, repairs, maintenance, code compliance, emergencies, and lawful showings, with notice when notice is required by law. No clause authorizes unlawful entry.</p>'+
  '<h2>8. ALTERATIONS / LOCKS</h2><p>No material alteration, fixture installation, painting outside approved colors, structural work, or lock change may be made without written permission where permission may lawfully be required. Tenant must provide access consistent with law.</p>'+
  '<h2>9. ASSIGNMENT / SUBLETTING</h2><p>Assignment or subletting is subject to New York law and any lawful written consent requirement. This clause does not waive rights that New York law makes non-waivable.</p>'+
  '<h2>10. PETS</h2><p>'+esc(o.pets)+'. Any permitted animal remains subject to applicable law, reasonable rules, nuisance restrictions and damage responsibility.</p>'+
  '<h2>11. SMOKING / VAPING</h2><p>'+esc(o.smoking)+'. Tenant is responsible for smoke-related damage caused by Tenant, occupants or guests to the extent permitted by law.</p>'+
  '<h2>12. HOUSE RULES / COMMON AREAS</h2><p>Tenant shall keep halls, stairs, exits and other common or means-of-egress areas unobstructed; comply with lawful sanitation, recycling and fire-safety rules; and not store property in a manner that creates a fire, water or safety hazard.</p>'+
  '<h2>13. INSURANCE</h2><p>Tenant is encouraged to maintain renter\'s insurance for personal property, liability, temporary housing and other tenant-side risks. Landlord\'s insurance generally does not insure Tenant\'s belongings.</p>'+
  '<h2>14. DEFAULT / REMEDIES</h2><p>If Tenant fails to pay rent or materially breaches a lawful lease obligation, Landlord may use only the notices, court procedures and remedies permitted by New York law. Nothing in this lease permits self-help eviction, utility shutoff, unlawful lockout, waiver of habitability, or any other remedy prohibited by law.</p>'+
  '<h2>15. GOOD CAUSE EVICTION NOTICE</h2><p>'+esc(goodCauseText(o.goodCause))+'</p>'+
  '<h2>16. REQUIRED DISCLOSURES / RIDERS</h2><p><b>Lead:</b> '+esc(o.lead)+'.<br><b>Bedbug:</b> '+esc(o.bedbug)+'. The parties acknowledge that required government notices/riders, when applicable, are incorporated by reference and should be attached to the executed lease.</p>'+
  '<h2>17. ENTIRE AGREEMENT / CHANGES</h2><p>This lease and attached riders are the parties\' agreement concerning the tenancy. Any change should be in writing and signed or otherwise validly agreed to by the parties. If a clause conflicts with controlling law, the controlling law governs and the remainder of the lease remains in effect to the extent enforceable.</p>'+
  (o.extra?'<h2>18. ADDITIONAL LANDLORD RULES / RIDERS</h2><p>'+esc(o.extra).replace(/\n/g,"<br>")+'</p>':'')+
  '<h2>SIGNATURE CONSENT</h2><p>By signing, each party confirms that they reviewed this lease and attached riders and intends the signature to authenticate and approve the agreement. Electronic signatures may be used where legally permitted.</p>'+sigs;
}
function generateLeasePreview(){
  const o=leaseFormValues();
  if(!o.propertyId||!o.landlord||!o.tenant||!o.start||!o.end||!o.rent){alert("Complete the property, landlord, tenant, dates and rent fields first.");return}
  if(o.deposit>o.rent){alert("Security deposit cannot exceed one month\'s rent. PropertyWorks will cap it at the monthly rent.");o.deposit=o.rent}
  window.currentLeaseDraft=o;
  document.getElementById("leasePreview").innerHTML=leaseHtml(o,false)+'<div class="job-actions"><button class="btn btn-primary" onclick="signLease()">Sign Lease</button><button class="btn btn-soft" onclick="printLease()">Print / Save PDF</button><button class="btn btn-soft" onclick="saveLeaseDraft()">Save Draft</button></div>';
}
function signLease(){
  const o=window.currentLeaseDraft;if(!o){alert("Generate the lease first.");return}
  modal("Sign Lease","ELECTRONIC SIGNATURE",
    field("Landlord typed signature","landlordSignature")+
    field("Tenant typed signature","tenantSignature")+
    '<div class="field full"><label><input type="checkbox" name="consent" value="yes" required> Each signer adopts the typed name as an electronic signature and intends to sign this lease.</label></div>',
    async s=>{
      o.landlordSignature=s.landlordSignature;o.tenantSignature=s.tenantSignature;o.landlordSignedAt=new Date().toLocaleString();o.tenantSignedAt=o.landlordSignedAt;o.executed=true;
      window.currentLeaseDraft=o;document.getElementById("leasePreview").innerHTML=leaseHtml(o,true)+'<div class="job-actions"><button class="btn btn-primary" onclick="storeSignedLease()">Store Signed Lease</button><button class="btn btn-soft" onclick="printLease()">Print / Save PDF</button></div>';
    }
  )
}
function printLease(){
  const o=window.currentLeaseDraft;if(!o){alert("Generate the lease first.");return}
  const w=window.open("","_blank");w.document.write('<!doctype html><html><head><title>Residential Lease</title><style>body{font-family:Georgia,serif;max-width:850px;margin:32px auto;padding:20px;line-height:1.45}h1{text-align:center;font-size:22px}h2{font-family:Arial,sans-serif;font-size:13px;margin-top:20px}p,li{font-size:12px}.lease-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.sigline{border-top:1px solid #000;padding-top:6px}</style></head><body>'+leaseHtml(o,!!o.executed)+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)
}
function saveLeaseDraft(){
  const o=window.currentLeaseDraft;if(!o)return;o.id=o.id||uid("lease");o.status="Draft";data.generatedLeases.unshift({...o});save();alert("Lease draft saved in PropertyWorks on this device.")
}
async function storeSignedLease(){
  const o=window.currentLeaseDraft;if(!o||!o.executed){alert("Sign the lease first.");return}
  if(!cloudUser){alert("Sign in to PropertyWorks Cloud first so the executed lease can be stored securely.");return}
  const filename=("Lease_"+(prop(o.propertyId)?.name||"Property")+"_"+o.tenant+"_"+o.start).replace(/[^a-zA-Z0-9._-]+/g,"_")+".html";
  const path=cloudUser.id+"/leases/"+Date.now()+"_"+filename;
  const html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(filename)+'</title><style>body{font-family:Georgia,serif;max-width:850px;margin:32px auto;padding:20px;line-height:1.45}h1{text-align:center}h2{font:700 13px Arial,sans-serif;margin-top:20px}p{font-size:12px}.lease-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.sigline{border-top:1px solid #000;padding-top:6px}</style></head><body>'+leaseHtml(o,true)+'</body></html>';
  const up=await supabaseClient.storage.from("property-documents").upload(path,new Blob([html],{type:"text/html"}),{contentType:"text/html",upsert:false});
  if(up.error){alert("Lease storage failed: "+up.error.message);return}
  const ins=await supabaseClient.from("documents").insert({owner_id:cloudUser.id,property_id:o.propertyId,storage_path:path,document_name:filename,document_type:"Lease"});
  if(ins.error){alert("Lease file stored, but document index failed: "+ins.error.message);return}
  o.id=o.id||uid("lease");o.status="Executed";o.storagePath=path;data.generatedLeases.unshift({...o});localStorage.setItem(KEY,JSON.stringify(data));notifyParty("owner","Lease stored","Signed lease for "+o.tenant+" was saved to secure PropertyWorks storage.");alert("Signed lease stored securely in PropertyWorks.");
}

/span></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">No activated tenant accounts yet.</div>')+'</div>'}
function createTenantInvite(){modal("Invite Tenant","TENANT ONBOARDING",field("Tenant name","name")+field("Email","email","email")+select("Property","propertyId",opts(data.properties))+field("Unit / Apartment","unit"),o=>{const code=makeInviteCode();authData.invites.unshift({id:uid("inv"),name:o.name,email:o.email.trim().toLowerCase(),propertyId:o.propertyId,unit:o.unit,code:code,status:"Pending",createdAt:new Date().toISOString()});saveAuth();render();alert("Invite created. Share this activation code with the tenant: "+code)})}
function tenantLoginModal(){modal("Tenant Sign In","TENANT PORTAL",field("Email","email","email")+field("Password","password","password"),async o=>{const email=o.email.trim().toLowerCase();const hash=await hashPassword(o.password);const acct=authData.accounts.find(a=>a.email===email&&a.passwordHash===hash);if(!acct){alert("Email or password is incorrect.");return}tenantSession={accountId:acct.id,email:acct.email};localStorage.setItem("propertyworks_tenant_session",JSON.stringify(tenantSession));currentRole="tenant";localStorage.setItem("propertyworks_role","tenant");view="tenantHome";render()})}
function activateTenantInvite(){modal("Create Tenant Account","ACTIVATE INVITE",field("Invitation code","code")+field("Email","email","email")+field("Create password","password","password"),async o=>{const code=o.code.trim().toUpperCase();const email=o.email.trim().toLowerCase();const inv=authData.invites.find(i=>i.code===code&&i.email===email&&i.status==="Pending");if(!inv){alert("Invitation not found. Check the code and email.");return}if((o.password||"").length<8){alert("Password must be at least 8 characters.");return}const passwordHash=await hashPassword(o.password);const acct={id:uid("acct"),name:inv.name,email:inv.email,propertyId:inv.propertyId,unit:inv.unit,passwordHash:passwordHash,createdAt:new Date().toISOString()};authData.accounts.push(acct);inv.status="Activated";inv.activatedAt=new Date().toISOString();saveAuth();tenantSession={accountId:acct.id,email:acct.email};localStorage.setItem("propertyworks_tenant_session",JSON.stringify(tenantSession));currentRole="tenant";localStorage.setItem("propertyworks_role","tenant");view="tenantHome";render();alert("Your tenant account is ready.")})}
function tenantSignOut(){tenantSession=null;localStorage.removeItem("propertyworks_tenant_session");view="tenantAuth";render()}
function currentTenantAccount(){return tenantSession?authData.accounts.find(a=>a.id===tenantSession.accountId):null}
function tenantAuth(){setHeader("Tenant Portal","Sign in or activate your invitation.");content.innerHTML='<div class="auth-wrap"><div class="card auth-card"><div class="brandmark" style="margin-bottom:16px">PW</div><h3>Welcome to PropertyWorks</h3><p>Use PropertyWorks to submit maintenance requests, add details about the issue, and track the repair status so maintenance can be assigned and scheduled faster.</p><div class="auth-actions"><button class="btn btn-primary" onclick="tenantLoginModal()">Sign In</button><button class="btn btn-soft" onclick="activateTenantInvite()">Activate Invitation</button></div></div></div>'}
function tenantHome(){const acct=currentTenantAccount();if(!acct){tenantAuth();return}setHeader("Tenant Portal","Request repairs and follow the status of your maintenance requests.");const requests=(data.maintenance||[]).filter(x=>x.source==="Tenant"&&x.tenantAccountId===acct.id);content.innerHTML='<div class="grid2"><div class="card panel"><div class="panelhead"><div><h3>Need something repaired?</h3><p>Submit a maintenance request directly to property management.</p></div></div><button class="btn btn-primary" onclick="tenantRepairForm()">＋ Request a Repair</button></div><div class="card panel"><div class="panelhead"><div><h3>Your Requests</h3><p>Track open and completed service requests.</p></div><span class="chip">'+requests.length+' requests</span></div>'+simpleList(requests,x=>x.title||"Repair request",x=>(x.status||"Open")+' · '+df(x.date))+'</div></div>'}
function tenantService(){const acct=currentTenantAccount();if(!acct){tenantAuth();return}setHeader("Maintenance Requests","Submit a repair request or check its status.");const requests=(data.maintenance||[]).filter(x=>x.source==="Tenant"&&x.tenantAccountId===acct.id);content.innerHTML='<div class="sectionbar"><div><b style="font-size:13px">My Maintenance Requests</b><div class="rowsub">Only repair requests are available in the tenant portal.</div></div><button class="btn btn-primary" onclick="tenantRepairForm()">＋ New Request</button></div><div class="card tablecard">'+(requests.length?'<table><thead><tr><th>Date</th><th>Issue</th><th>Urgency</th><th>Status</th></tr></thead><tbody>'+requests.map(m=>'<tr><td>'+df(m.date)+'</td><td><div class="rowtitle">'+esc(m.title||"Repair request")+'</div><div class="rowsub">'+esc(m.description||"")+'</div></td><td>'+esc(m.priority||"Normal")+'</td><td><span class="status '+(m.status==="Completed"?"good":"warn")+'">'+esc(m.status||"Open")+'</span></td></tr>').join("")+'</tbody></table>':'<div class="empty">No maintenance requests yet.</div>')+'</div>'}

function sendForBids(id){const m=data.maintenance.find(x=>x.id===id);if(!m)return;m.marketplaceStatus="Open for Bids";m.bidOpenedAt=new Date().toISOString();if(data.automation.autoPrepareSocial){m.socialPost='Handyman / Contractor Job – Staten Island\n'+(m.title||m.category||"Maintenance job")+'\nArea: Staten Island, NY\nUrgency: '+(m.priority||"Normal")+'\nSubmit price and availability through PropertyWorks.'}if(data.automation.autoNotifyContractors){data.contractors.forEach(c=>notifyParty("contractor","New job available",(m.title||"Maintenance job")+" is open for bids.",{jobId:m.id,contractorId:c.id}))}notifyParty("owner","Job opened for bids",(m.title||"Maintenance job")+" is now accepting contractor bids.",{jobId:m.id});save();alert("Job is open for bids. PropertyWorks prepared the social post and notified existing contractors.");setView("marketplace")}
function marketplace(){setHeader("Maintenance Marketplace","Send repair work to local technicians, compare bids, award jobs and approve completion.");const jobs=(data.maintenance||[]).filter(x=>x.marketplaceStatus);content.innerHTML='<div class="kpis">'+metric("Open for Bids",jobs.filter(x=>x.marketplaceStatus==="Open for Bids").length,"Jobs accepting offers","⚒")+metric("Bids Received",(data.bids||[]).length,"Contractor price + availability","$")+metric("Awarded",jobs.filter(x=>x.marketplaceStatus==="Awarded").length,"Jobs assigned to a technician","✓")+metric("Completed",jobs.filter(x=>x.marketplaceStatus==="Completed").length,"Awaiting/finished payment","★")+'</div><div class="sectionbar" style="margin-top:16px"><div><b style="font-size:13px">Marketplace Jobs</b><div class="rowsub">Tenants never see bids, contractor pricing or owner notes.</div></div><button class="btn btn-soft" onclick="contractorProfileForm()">＋ Add Contractor</button></div><div class="market-grid"><div><div class="propertygrid" style="grid-template-columns:1fr">'+(jobs.length?jobs.map(m=>jobCard(m,true)).join(""):'<div class="card empty">No jobs have been sent for bids yet. Open Service Requests and choose Send for Bids.</div>')+'</div></div><div><div class="card panel"><div class="panelhead"><div><h3>Contractor Network</h3><p>Technicians who can bid on future jobs</p></div></div>'+(data.contractors.length?data.contractors.map(c=>'<div class="biditem"><div class="rowtitle">'+esc(c.name)+'</div><div class="rowsub">'+esc(c.trades||"General handyman")+' · '+esc(c.area||"Staten Island")+'</div><div class="stars">★★★★★ <span style="color:var(--muted)">'+(c.jobs||0)+' jobs</span></div></div>').join(""):'<div class="empty">No contractors registered yet.</div>')+'</div></div></div>'}
function jobCard(m,ownerView){const bids=(data.bids||[]).filter(b=>b.jobId===m.id);const awarded=bids.find(b=>b.id===m.awardedBidId);return '<div class="card jobcard"><div class="panelhead"><div><h3>'+esc(m.title||m.category||"Repair request")+'</h3><p>'+esc(prop(m.propertyId)?.name||"")+' · '+esc(m.unit||"Common area")+'</p></div><span class="chip '+(m.marketplaceStatus==="Open for Bids"?"warn":"good")+'">'+esc(m.marketplaceStatus)+'</span></div><div class="rowsub">'+esc(m.description||"No description")+'</div><div class="jobmeta"><span class="chip">'+esc(m.priority||"Normal")+'</span><span class="chip">'+bids.length+' bid'+(bids.length===1?"":"s")+'</span>'+(m.schedule?'<span class="chip good">'+esc(m.schedule)+'</span>':'')+'</div>'+(ownerView?'<div class="job-actions">'+(m.marketplaceStatus==="Open for Bids"?'<button class="btn btn-soft" onclick="shareJob(\''+m.id+'\')">Share Job</button>':'')+(awarded?'<button class="btn btn-soft" onclick="markPaid(\''+m.id+'\')">Mark Paid / Zelle</button>':'')+'</div><div class="bidlist" style="margin-top:12px">'+(bids.length?bids.map(b=>bidRow(b,m)).join(""):'<div class="rowsub">No bids yet.</div>')+'</div>':'<div class="job-actions"><button class="btn btn-primary" onclick="placeBid(\''+m.id+'\')">Bid on Job</button></div>')+(m.beforePhotos||m.afterPhotos?'<div class="photo-grid" style="margin-top:12px"><div class="photo-ph">Before photos recorded</div><div class="photo-ph">After photos recorded</div></div>':'')+'</div>'}
function bidRow(b,m){const c=data.contractors.find(x=>x.id===b.contractorId);return '<div class="biditem"><div class="bidtop"><div><div class="rowtitle">'+esc(c?.name||b.contractorName||"Contractor")+'</div><div class="rowsub">'+esc(b.availability||"Availability not specified")+'</div></div><div class="bidprice">'+money(b.amount)+'</div></div><div class="rowsub">'+esc(b.notes||"")+'</div><div class="job-actions">'+(m.awardedBidId===b.id?'<span class="chip good">Awarded</span>':'<button class="btn btn-primary" onclick="awardBid(\''+m.id+'\',\''+b.id+'\')">Award Job</button>')+'</div></div>'}
function shareJob(id){const m=data.maintenance.find(x=>x.id===id);const text='Handyman / Technician Job – Staten Island\n'+(m.title||m.category||"Maintenance job")+'\n'+(prop(m.propertyId)?.name||"Property")+' · '+(m.unit||"")+'\nUrgency: '+(m.priority||"Normal")+'\nSubmit your price and earliest availability through PropertyWorks.';if(navigator.share){navigator.share({title:"PropertyWorks Job",text:text,url:location.href})}else{navigator.clipboard?.writeText(text+"\n"+location.href);alert("Job post copied. Paste it into Facebook Marketplace or local Staten Island community/contractor groups.")}}
function contractorProfileForm(){modal("Contractor Profile","PROPERTYWORKS PRO",field("Name / business","name")+field("Trades","trades")+field("Phone","phone")+field("Email","email","email")+field("Service area","area")+select("Insurance / license status","credential","<option>General handyman</option><option>Insured</option><option>Licensed trade</option><option>Licensed & insured</option>"),o=>{data.contractors.push({id:uid("c"),...o,jobs:0,rating:5});save();if(currentRole==="contractor")setView("contractorHome")})}
function contractorHome(){setHeader("PropertyWorks Pro","Browse available local maintenance jobs and submit your bid.");const jobs=(data.maintenance||[]).filter(x=>x.marketplaceStatus==="Open for Bids");content.innerHTML='<div class="privacy-note">Exact tenant contact information and private owner notes are not shown before a job is awarded. Only job scope, general location/property, urgency and scheduling information are shown.</div><div class="propertygrid" style="grid-template-columns:1fr;margin-top:14px">'+(jobs.length?jobs.map(m=>jobCard(m,false)).join(""):'<div class="card empty">No open jobs are accepting bids right now.</div>')+'</div>'}
function placeBid(jobId){if(!data.contractors.length){contractorProfileForm();return}modal("Bid on Job","PROPERTYWORKS PRO",select("Contractor","contractorId",opts(data.contractors))+field("Your price","amount","number")+field("Earliest availability","availability")+area("Bid notes / materials included","notes"),o=>{const bid={id:uid("bid"),jobId,...o,amount:+o.amount||0,date:new Date().toISOString()};data.bids.unshift(bid);notifyParty("owner","New contractor bid","A new bid of "+money(bid.amount)+" was submitted.",{jobId});notifyParty("contractor","Bid submitted","Your bid was sent to the property owner.",{jobId});save();setView("contractorHome")})}
function awardBid(jobId,bidId){const m=data.maintenance.find(x=>x.id===jobId);const b=data.bids.find(x=>x.id===bidId);if(!m||!b)return;m.awardedBidId=bidId;m.marketplaceStatus="Awarded";m.status="Scheduled";m.schedule=b.availability||"To be scheduled";const c=data.contractors.find(x=>x.id===b.contractorId);if(c)c.jobs=(c.jobs||0)+1;notifyParty("contractor","Job awarded","You were awarded "+(m.title||"the maintenance job")+".",{jobId:m.id,contractorId:c?.id});notifyParty("tenant","Repair assigned","A technician has been assigned to your maintenance request.",{jobId:m.id});notifyParty("owner","Contractor selected",(c?.name||"Contractor")+" was awarded the job.",{jobId:m.id});save()}
function contractorMyJobs(){setHeader("My Jobs","Awarded jobs, completion photos and payment status.");const jobs=(data.maintenance||[]).filter(x=>x.marketplaceStatus==="Awarded"||x.marketplaceStatus==="Completed");content.innerHTML='<div class="propertygrid" style="grid-template-columns:1fr">'+(jobs.length?jobs.map(m=>'<div class="card jobcard"><div class="panelhead"><div><h3>'+esc(m.title||"Maintenance job")+'</h3><p>'+esc(prop(m.propertyId)?.name||"")+' · '+esc(m.unit||"")+'</p></div><span class="chip good">'+esc(m.marketplaceStatus)+'</span></div><div class="rowsub">Schedule: '+esc(m.schedule||"Coordinate with owner")+'</div><div class="job-actions">'+(m.marketplaceStatus!=="Completed"?'<button class="btn btn-primary" onclick="completeJob(\''+m.id+'\')">Upload Proof & Complete</button>':'<span class="chip good">Work completed</span>')+'</div></div>').join(""):'<div class="card empty">No awarded jobs yet.</div>')+'</div>'}
function completeJob(id){modal("Complete Job","BEFORE / AFTER PROOF",field("Before photo reference","beforePhotos")+field("After photo reference","afterPhotos")+field("Materials / receipt total","materials","number")+area("Completion notes","completionNotes"),o=>{const m=data.maintenance.find(x=>x.id===id);Object.assign(m,o,{marketplaceStatus:"Completed",status:"Completed",completedAt:new Date().toISOString(),paymentStatus:"Awaiting Owner Approval"});notifyParty("owner","Job completed","Contractor marked "+(m.title||"the job")+" complete and submitted completion details.",{jobId:m.id});notifyParty("tenant","Repair completed","Your maintenance request has been marked complete.",{jobId:m.id});notifyParty("contractor","Completion submitted","The completed job is awaiting owner approval/payment.",{jobId:m.id});save();setView("contractorMyJobs")})}
function markPaid(id){const m=data.maintenance.find(x=>x.id===id);if(!m)return;modal("Record Contractor Payment","PAYMENT",select("Method","paymentMethod","<option>Zelle</option><option>Paid in App</option><option>Check</option><option>Cash</option>")+field("Payment reference / note","paymentReference"),o=>{m.paymentStatus="Paid";m.paymentMethod=o.paymentMethod;m.paymentReference=o.paymentReference;m.paidAt=new Date().toISOString();notifyParty("contractor","Payment recorded","Payment was recorded via "+o.paymentMethod+".",{jobId:m.id});notifyParty("owner","Contractor paid","Payment was marked complete via "+o.paymentMethod+".",{jobId:m.id});save();setView("marketplace")})}
function contractorProfile(){setHeader("Contractor Profile","Manage trade specialties and service area.");content.innerHTML='<div class="card panel"><div class="panelhead"><div><h3>PropertyWorks Pro Profile</h3><p>Build trust with owners before bidding.</p></div></div>'+(data.contractors.length?data.contractors.map(c=>'<div class="contractor-card"><div class="rowtitle">'+esc(c.name)+'</div><div class="rowsub">'+esc(c.trades||"General handyman")+' · '+esc(c.area||"Staten Island")+'</div><div class="kv"><span>Credential</span><b>'+esc(c.credential||"General handyman")+'</b></div><div class="kv"><span>Completed / awarded jobs</span><b>'+(c.jobs||0)+'</b></div></div>').join(""):'<div class="empty">Create your contractor profile to start bidding.</div>')+'<button class="btn btn-primary" onclick="contractorProfileForm()">＋ Add / Create Profile</button></div>'}

function cameras(){setHeader("Cameras","Owner-only property camera dashboard.");content.innerHTML='<div class="card panel"><div class="panelhead"><div><h3>Camera Integrations</h3><p>Reserved for owner/admin access only.</p></div><span class="chip">Coming soon</span></div><div class="empty">This area is intentionally not available to tenant accounts. Future Ring or other supported camera integrations can be connected here.</div></div>'}
function switchRole(role){currentRole=role;localStorage.setItem("propertyworks_role",role);view=role==="tenant"?(tenantSession?"tenantHome":"tenantAuth"):role==="contractor"?"contractorHome":"overview";render()}
function render(){navRender();const routes=currentRole==="tenant"?{tenantAuth,tenantHome,tenantService,notifications}:currentRole==="contractor"?{contractorHome,contractorMyJobs,contractorProfile,notifications}:{overview,properties,rentals,leaseGenerator,tenantAccounts,service,marketplace,notifications,automation,cameras,deals,renovations,financials,reports,documents};(routes[view]|| (currentRole==="tenant"?(tenantSession?tenantHome:tenantAuth):currentRole==="contractor"?contractorHome:overview))()}function setView(v){view=v;render()}
function opts(arr){return arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("")}function field(label,name,type="text",extra=""){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+extra+'></div>'}function select(label,name,options){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+options+'</select></div>'}function area(label,name){return '<div class="field full"><label>'+label+'</label><textarea name="'+name+'"></textarea></div>'}function modal(title,eyebrow,body,fn){modalTitle.textContent=title;modalEyebrow.textContent=eyebrow;modalBody.innerHTML='<div class="formgrid">'+body+'</div>';dlg.showModal();form.onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target).entries()));dlg.close()}}
function quickAdd(){modal("What do you want to add?","QUICK ADD",select("Record type","kind",'<option value="property">Property</option><option value="payment">Rent payment</option><option value="tenant">Tenant</option><option value="lease">Lease</option><option value="service">Tenant service request</option><option value="invite">Tenant invitation</option><option value="contractor">Contractor profile</option><option value="deal">Buy/Sell deal</option><option value="reno">Renovation</option><option value="expense">Expense</option><option value="document">Document</option>'),o=>setTimeout(()=>({property:addProperty,payment:addPayment,tenant:addTenant,lease:addLease,service:tenantRepairForm,invite:createTenantInvite,contractor:contractorProfileForm,deal:addDeal,reno:addRenovation,expense:addExpense,document:addDocument}[o.kind]()),40))}
function addProperty(){modal("Add Property","PROPERTY",field("Name","name")+field("Address","address")+field("Type","type")+field("Units","units","number",'min="1" value="1"')+field("Occupied units","occupied","number",'min="0" value="0"')+field("Monthly rent","rent","number",'min="0"'),o=>{data.properties.push({id:uid("p"),...o,units:+o.units,occupied:+o.occupied,rent:+o.rent||0});save()})}
function editProperty(id){
  const p=data.properties.find(x=>x.id===id); if(!p)return;
  const body='<div class="field"><label>Name</label><input name="name" value="'+esc(p.name)+'"></div>'+
  '<div class="field"><label>Address</label><input name="address" value="'+esc(p.address)+'"></div>'+
  '<div class="field"><label>Type</label><input name="type" value="'+esc(p.type||"")+'"></div>'+
  '<div class="field"><label>Units</label><input name="units" type="number" min="1" value="'+(+p.units||1)+'"></div>'+
  '<div class="field"><label>Occupied units</label><input name="occupied" type="number" min="0" value="'+(+p.occupied||0)+'"></div>'+
  '<div class="field"><label>Monthly rent</label><input name="rent" type="number" min="0" value="'+(+p.rent||0)+'"></div>';
  modal("Edit Property","PROPERTY",body,o=>{Object.assign(p,{name:o.name,address:o.address,type:o.type,units:+o.units||1,occupied:+o.occupied||0,rent:+o.rent||0});save()})
}
function addTenant(){modal("Add Tenant","RENTALS",field("Full name","name")+select("Property","propertyId",opts(data.properties))+field("Unit","unit")+field("Phone","phone")+field("Email","email","email"),o=>{data.tenants.push({id:uid("t"),...o});save()})}
function addLease(){modal("Add Lease","RENTALS",select("Tenant","tenantId",opts(data.tenants))+select("Property","propertyId",opts(data.properties))+field("Unit","unit")+field("Rent","rent","number")+field("Start","start","date")+field("End","end","date")+select("Status","status","<option>Active</option><option>Pending</option><option>Ended</option>"),o=>{data.leases.push({id:uid("l"),...o,rent:+o.rent||0});save()})}
function addPayment(){modal("Record Payment","RENT",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+select("Tenant","tenantId",opts(data.tenants))+select("Source","source","<option>Tenant</option><option>Section 8</option><option>CityFHEPS</option><option>Other Agency</option>")+field("Amount","amount","number")+select("Status","status","<option>Paid</option><option>Pending</option><option>Late</option>"),o=>{data.payments.unshift({id:uid("pay"),...o,amount:+o.amount||0});save()})}
function addMaintenance(){modal("Add Maintenance","WORK ORDER",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+field("Unit / Area","unit")+field("Issue","title")+select("Priority","priority","<option>Normal</option><option>High</option><option>Urgent</option>")+select("Status","status","<option>Open</option><option>Scheduled</option><option>In Progress</option><option>Completed</option>"),o=>{data.maintenance.unshift({id:uid("m"),...o});save()})}
function addDeal(){modal("Add Buy/Sell Deal","DEAL",field("Deal name","name")+select("Type","type","<option>Acquisition</option><option>Sale</option>")+field("Address","address")+field("Price / Target","price","number")+select("Stage","stage","<option>Researching</option><option>Offer</option><option>Under Contract</option><option>Closing</option><option>Closed</option>"),o=>{data.deals.unshift({id:uid("deal"),...o,price:+o.price||0});save()})}
function addRenovation(){modal("Add Renovation Project","PROJECT",field("Project name","name")+select("Property","propertyId",opts(data.properties))+field("Budget","budget","number")+field("Spent","spent","number")+field("Contractor","contractor")+select("Status","status","<option>Planning</option><option>In Progress</option><option>On Hold</option><option>Completed</option>"),o=>{data.renovations.unshift({id:uid("r"),...o,budget:+o.budget||0,spent:+o.spent||0});save()})}
function addExpense(){modal("Add Expense","FINANCIALS",field("Date","date","date")+select("Property","propertyId",opts(data.properties))+select("Category","category","<option>Repairs & Maintenance</option><option>Utilities</option><option>Insurance</option><option>Property Tax</option><option>Mortgage Interest</option><option>Legal / Professional</option><option>Other</option>")+field("Vendor","vendor")+field("Amount","amount","number"),o=>{data.expenses.unshift({id:uid("e"),...o,amount:+o.amount||0});save()})}
function addDocument(){modal("Add Document","DOCUMENT",field("Name","name")+select("Property","propertyId",opts(data.properties))+select("Type","type","<option>Lease</option><option>Contract</option><option>Notice</option><option>Receipt / Invoice</option><option>Insurance</option><option>Tax</option><option>Other</option>")+field("Date","date","date")+area("Notes","notes"),o=>{data.documents.unshift({id:uid("d"),...o});save()})}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="propertyworks-backup.json";a.click()}if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}render();initCloud();
</script>
</body></html>
